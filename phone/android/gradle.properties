org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# This machine's IPv6 route to services.gradle.org black-holes, so the Gradle
# wrapper's download times out while other tools succeed. Forcing IPv4 for the
# JVM makes builds work without needing an environment variable set by hand.
systemProp.java.net.preferIPv4Stack=true

# Kotlin's incremental compiler cannot relativise paths across drives. On the
# Windows release runner the project is on D: and the pub cache (where Flutter
# plugins' Kotlin sources live) on C:, so a plugin's compile fails with "Could
# not close incremental caches". 1.1.0's first release build died this way on
# webview_flutter_android, pulled in by the ads SDK; local builds, all on C:,
# never show it. Release builds are clean builds anyway.
kotlin.incremental=false

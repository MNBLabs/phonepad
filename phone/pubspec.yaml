name: phonepad
description: "PhonePad - an Android phone as a wireless Xbox-compatible controller for Windows."
publish_to: 'none'

# The build number after `+` must increase on every release or Android refuses
# the upgrade.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  cryptography: ^2.9.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/tile.png

  # Bricolage Grotesque (OFL, fonts/OFL.txt). Two optical sizes of the same
  # family: the 12pt cut for interface text, the 96pt cut for titles and the
  # headline, so a settings label and the first-run headline share one voice.
  fonts:
    - family: Bricolage
      fonts:
        - asset: fonts/BricolageGrotesque12pt-Regular.ttf
          weight: 400
        - asset: fonts/BricolageGrotesque12pt-Medium.ttf
          weight: 500
        - asset: fonts/BricolageGrotesque12pt-SemiBold.ttf
          weight: 600
    - family: BricolageDisplay
      fonts:
        - asset: fonts/BricolageGrotesque96pt-SemiBold.ttf
          weight: 600
        - asset: fonts/BricolageGrotesque96pt-ExtraBold.ttf
          weight: 800

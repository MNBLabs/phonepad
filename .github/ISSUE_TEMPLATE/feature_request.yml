name: Feature request
description: Suggest something
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do
      description: >
        The goal, not only the feature. There is often already a way, and where
        there is not, knowing the goal usually changes the answer.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Including other apps, if this is something they do well.
